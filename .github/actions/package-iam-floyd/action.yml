---
name: Package iam-floyd
description: >-
  Transpiles the core of iam-floyd and builds its native package for one language into
  dist/iam-floyd/<language>. Needs the checked out code.

inputs:
  language:
    description: python, java, dotnet or go
    required: true
  version:
    description: >-
      Version of Python, .NET or Go to set up next to the one that builds, for the tests of the
      package. Java builds with the newest LTS, the tests set up their version themselves.
    required: true

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24.x

    - name: Set up Python
      if: inputs.language == 'python'
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.version }}

    - name: Set up uv
      if: inputs.language == 'python'
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

    - name: Set up Java to build
      if: inputs.language == 'java'
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: temurin
        java-version: 25

    # The SDK of the newest version builds, and the tests run with the framework of the version
    - name: Set up .NET
      if: inputs.language == 'dotnet'
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: |
          ${{ inputs.version }}.x
          10.x

    - name: Set up Go
      if: inputs.language == 'go'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ inputs.version }}
        cache: false

    # hatchling needs a newer Python than the package
    - name: Build
      shell: bash
      run: make install package-native LANGUAGES="$LANGUAGE"
      env:
        LANGUAGE: ${{ inputs.language }}
        # renovate: datasource=python-version depName=python
        UV_PYTHON: "3.14"
