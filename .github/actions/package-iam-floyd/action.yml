---
name: Package iam-floyd
description: >-
  Transpiles the core of iam-floyd and builds its native package for one language into
  dist/iam-floyd/<language>, or only sets up the language and installs the npm packages. Needs the
  checked out code.

inputs:
  language:
    description: python, java, dotnet or go
    required: true
  version:
    description: >-
      Version of Python, .NET or Go to set up next to the one that builds, for the tests of the
      package. Java builds with the newest LTS, the tests set up their version themselves.
    required: true
  package:
    description: Whether to build the package, otherwise only the setup
    required: false
    default: "true"
  cache:
    description: Whether mise caches Node.js and Bun, off in publish.yml
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Set up Node.js and Bun
      uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
      with:
        cache: ${{ inputs.cache }}

    - name: Set up Python
      if: inputs.language == 'python'
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.version }}

    - name: Set up uv
      if: inputs.language == 'python'
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

    - name: Set up Java to build
      if: inputs.language == 'java'
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        distribution: temurin
        java-version: 25

    # The SDK of the newest version builds, and the tests run with the framework of the version
    - name: Set up .NET
      if: inputs.language == 'dotnet'
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: |
          ${{ inputs.version }}.x
          10.x

    - name: Set up Go
      if: inputs.language == 'go'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ inputs.version }}
        cache: false

    - name: Install
      if: inputs.package != 'true'
      shell: bash
      run: make install

    # hatchling needs a newer Python than the package
    - name: Build
      if: inputs.package == 'true'
      shell: bash
      run: make install package-native LANGUAGES="$LANGUAGE"
      env:
        LANGUAGE: ${{ inputs.language }}
        # renovate: datasource=python-version depName=python
        UV_PYTHON: "3.15"

    - name: Read the version
      if: inputs.package == 'true' && inputs.language == 'go'
      id: version
      shell: bash
      run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

    - name: Pack the Go module
      if: inputs.package == 'true' && inputs.language == 'go'
      uses: udondan/goproxy-gh-pages/pack@1bc5f4391f581dea5e41a9b64238111425605a74 # v1
      with:
        module-dir: go/iamfloyd
        version: ${{ steps.version.outputs.version }}
        output: dist/iam-floyd/go/iam-floyd-go-module-{version}.zip
