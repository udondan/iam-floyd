---
name: Package cdk-iam-floyd
description: >-
  Builds the CDK variant and its package for one language with jsii-pacmak into dist/. Needs the
  checked out code with the tags, for mise.toml as well.

inputs:
  language:
    description: typescript, python, java, dotnet or go
    required: true
  cache:
    description: Whether mise caches Node.js and Bun, off in publish.yml
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Set up Node.js and Bun
      uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
      with:
        cache: ${{ inputs.cache }}

    - name: Set up Python
      if: inputs.language == 'python'
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: 3.15

    - name: Set up Java
      if: inputs.language == 'java'
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        distribution: temurin
        java-version: 21

    - name: Set up .NET
      if: inputs.language == 'dotnet'
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: 11.x

    - name: Set up Go
      if: inputs.language == 'go'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: stable
        cache: false

    - name: Build packages
      shell: bash
      run: |
        make install
        make cdk
        make package-jsii LANGUAGES="$LANGUAGE"
      env:
        LANGUAGE: ${{ inputs.language }}

    - name: Read the version
      if: inputs.language == 'go'
      id: version
      shell: bash
      run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

    - name: Pack the Go module
      if: inputs.language == 'go'
      uses: udondan/goproxy-gh-pages/pack@1bc5f4391f581dea5e41a9b64238111425605a74 # v1
      with:
        module-dir: dist/go/cdkiamfloyd
        version: ${{ steps.version.outputs.version }}
        output: dist/go-module/cdk-iam-floyd-go-module-{version}.zip
