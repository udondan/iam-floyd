---
name: Schedule Release Automerge

on:
  schedule:
    - cron: "0 9 * * 1" # Every Monday at 9am UTC
  workflow_dispatch:

jobs:
  automerge:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    permissions: {} # gh uses OVERRIDE_TOKEN
    steps:
      - name: Enable auto-merge on release-please PR
        env:
          GH_TOKEN: ${{ secrets.OVERRIDE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          PRS=$(gh pr list \
            --label "autorelease: pending" \
            --base "$DEFAULT_BRANCH" \
            --state open \
            --json number)

          PR_COUNT=$(printf '%s' "$PRS" | jq 'length')

          if [ "$PR_COUNT" -gt 1 ]; then
            echo "Expected at most one open release-please PR, found $PR_COUNT"
            exit 1
          fi

          PR=$(printf '%s' "$PRS" | jq -r '.[0].number // empty')

          if [ -n "$PR" ]; then
            # Auto-merge waits for the branch to be up to date with main, and release-please leaves it
            # behind when the new commits don't change the release notes. With the REST API, as
            # `gh pr update-branch` queries fields that need the scope `repo`, and the token has
            # only `public_repo`.
            HEAD=$(gh api "repos/$GH_REPO/pulls/$PR" --jq .head.ref)
            BEHIND=$(gh api "repos/$GH_REPO/compare/$DEFAULT_BRANCH...$HEAD" --jq .behind_by)
            if [ "$BEHIND" -gt 0 ]; then
              gh api --method PUT "repos/$GH_REPO/pulls/$PR/update-branch" --silent
              echo "Updated PR #$PR, which was $BEHIND commit(s) behind $DEFAULT_BRANCH"
            fi
            gh pr merge "$PR" --auto --squash --delete-branch
            echo "Auto-merge enabled on PR #$PR"
          else
            echo "No open release-please PR found"
          fi
