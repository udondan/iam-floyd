---
name: Test / Publish

permissions:
  id-token: write # Required for OIDC
  contents: read

# Pull requests run the tests. release-please.yml starts this workflow with the tag of the draft
# release that release-please created: the packages are built from the tag, published, and the
# release is published last. The workflow is started, not called, because trusted publishing on
# npm, PyPI and NuGet is configured for this workflow file, and PyPI doesn't support reusable
# workflows.
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the draft release to publish, e.g. v1.2.3
        type: string
        required: true

jobs:
  # Only one run at a time may deploy to the AWS test account.
  wait-for-turn:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      actions: read
      contents: write # lock refs under refs/wait-for-turn/
      pull-requests: read # labels for label-weights
    # A new commit on the branch cancels the waiting of the outdated run, so the
    # new run doesn't queue behind it. Once a run has the turn, this job is
    # done: test jobs that already run are never cancelled.
    concurrency:
      group: test-wait-${{ github.head_ref || github.ref }}
      cancel-in-progress: true
    steps:
      # Queue order: manual PRs and releases first, then Renovate updates.
      # Fails right away if the branch is behind main. Branch protection
      # requires PRs to be up to date, so testing an outdated branch is wasted
      # time: it has to be updated and tested again.
      - name: Wait for turn
        uses: udondan/wait-for-turn@4a9f5171a1dbc3eb182410c772dae951e8ac26e3 # v1.3.0
        with:
          require-up-to-date: true
          label-weights: |
            renovate=-5

  test-iam-floyd:
    name: Test iam-floyd
    needs: wait-for-turn
    # A skipped job counts as passed for required checks. Run the job even if
    # wait-for-turn failed and fail it in the first step.
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check turn
        if: needs.wait-for-turn.result != 'success'
        run: exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: x

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Test npm package
        run: make install test-typescript

      - name: Dry run npm publish
        run: make build publish

  test-cdk-iam-floyd:
    name: Test cdk-iam-floyd
    needs: wait-for-turn
    # A skipped job counts as passed for required checks. Run the job even if
    # wait-for-turn failed and fail it in the first step.
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check turn
        if: needs.wait-for-turn.result != 'success'
        run: exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Build CDK variant
        run: |
          make install
          make cdk
          cat package.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Test npm package
        run: |
          make package
          make test-typescript-cdk
          make cdk-test

  # Python, Java, .NET and Go packages of cdk-iam-floyd, built with jsii-pacmak. One job per
  # language for speed; TypeScript is the baseline the others are compared to. When publishing,
  # the packages built here are the ones the publish jobs publish.
  test-cdk-iam-floyd-jsii:
    name: Test cdk-iam-floyd in ${{ matrix.language }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [typescript, python, java, dotnet, go]
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Set up Python
        if: matrix.language == 'python'
        uses: actions/setup-python@v6
        with:
          python-version: 3.14

      - name: Set up Java
        if: matrix.language == 'java'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up .NET
        if: matrix.language == 'dotnet'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Build packages
        run: |
          make install
          make cdk
          make package-jsii LANGUAGES=${{ matrix.language }}

      - name: Test packages
        run: make test-jsii LANGUAGES=${{ matrix.language }}

      # The npm package is published by publish-cdk-iam-floyd, with the jsii assembly
      - name: Dry run npm publish
        if: matrix.language == 'typescript'
        run: make publish

      # Signs, but does not upload without the Maven Central credentials
      - name: Build Maven Central bundle
        if: matrix.language == 'java'
        run: bin/publish-maven
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PRIVATE_KEY_PASSPHRASE: ${{ secrets.MAVEN_GPG_PRIVATE_KEY_PASSPHRASE }}

      - name: Store packages
        if: matrix.language != 'typescript' && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.language }}
          path: dist/${{ matrix.language == 'go' && 'go-module' || matrix.language }}
          if-no-files-found: error
          retention-days: 1

  # Assets can only be added to a draft release, published releases are immutable
  release:
    name: Check release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}

      - name: Get the version
        id: get_version
        run: |
          set -euo pipefail
          VERSION="$(jq -r .version package.json)"
          if [[ "v${VERSION}" != "${TAG}" ]]; then
            echo "::error::The version ${VERSION} in package.json does not match the tag ${TAG}"
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ inputs.tag }}

      - name: Check that the release is a draft
        run: |
          if [[ "$(gh release view "${TAG}" --repo "${{ github.repository }}" --json isDraft --jq .isDraft)" != "true" ]]; then
            echo "::error::Release ${TAG} is not a draft"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.OVERRIDE_TOKEN }} # draft releases need write access
          TAG: ${{ inputs.tag }}

  publish-iam-floyd:
    name: Publish iam-floyd
    needs:
      - release
      - test-cdk-iam-floyd-jsii
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      # npm authenticates with OIDC, there is no token
      - name: Publish to npm
        run: make install build publish
        env:
          NPM_PUBLISH: "true"

  publish-cdk-iam-floyd:
    name: Publish cdk-iam-floyd
    needs:
      - release
      - test-cdk-iam-floyd-jsii
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Build CDK variant
        run: |
          make install
          make cdk
          cat package.json

      # npm authenticates with OIDC, there is no token
      - name: Publish to npm
        run: make package-jsii publish LANGUAGES=typescript
        env:
          NPM_PUBLISH: "true"

  publish-cdk-iam-floyd-python:
    name: Publish cdk-iam-floyd to PyPI
    needs:
      - release
      - test-cdk-iam-floyd-jsii
    runs-on: ubuntu-latest
    steps:
      - name: Fetch packages
        uses: actions/download-artifact@v8
        with:
          name: packages-python
          path: dist/python

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/python

  publish-cdk-iam-floyd-dotnet:
    name: Publish cdk-iam-floyd to NuGet
    needs:
      - release
      - test-cdk-iam-floyd-jsii
    runs-on: ubuntu-latest
    steps:
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Fetch packages
        uses: actions/download-artifact@v8
        with:
          name: packages-dotnet
          path: dist/dotnet

      - name: Log in to NuGet
        id: nuget
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: udondan

      # The symbols package (.snupkg) next to it is pushed with it
      - name: Publish to NuGet
        run: |
          dotnet nuget push dist/dotnet/*.nupkg \
            --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json

  publish-cdk-iam-floyd-java:
    name: Publish cdk-iam-floyd to Maven Central
    needs:
      - release
      - test-cdk-iam-floyd-jsii
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}

      - name: Fetch packages
        uses: actions/download-artifact@v8
        with:
          name: packages-java
          path: dist/java

      - name: Publish to Maven Central
        run: bin/publish-maven
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PRIVATE_KEY_PASSPHRASE: ${{ secrets.MAVEN_GPG_PRIVATE_KEY_PASSPHRASE }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

  # The Go module is served by GitHub Pages as a static Go module proxy. The module zip of every
  # version is a release asset; the proxy serves the newest of them.
  publish-cdk-iam-floyd-go:
    name: Publish cdk-iam-floyd for Go
    needs:
      - release
      - test-cdk-iam-floyd-jsii
    runs-on: ubuntu-latest
    permissions:
      contents: write # release assets
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}

      - name: Fetch packages
        uses: actions/download-artifact@v8
        with:
          name: packages-go
          path: dist/go-module

      - name: Add module zip to release
        run: gh release upload "v${{ needs.release.outputs.version }}" dist/go-module/*.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      # Pages sites are limited to 1 GB and a module zip has about 9 MB
      - name: Fetch module zips of the newest releases
        run: |
          mkdir zips
          for tag in $(gh release list --limit 30 --json tagName --jq '.[].tagName'); do
            gh release download "${tag}" --pattern 'cdk-iam-floyd-go-module-*.zip' --dir zips || true
          done
          ls -l zips
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build Go module proxy
        run: bin/go-proxy site site zips/*.zip

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # The release stays a draft until everything is published and all assets are attached
  publish-release:
    name: Publish release
    needs:
      - release
      - publish-iam-floyd
      - publish-cdk-iam-floyd
      - publish-cdk-iam-floyd-python
      - publish-cdk-iam-floyd-dotnet
      - publish-cdk-iam-floyd-java
      - publish-cdk-iam-floyd-go
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}

      # release-please takes the notes from the body of the release PR, which has no IAM changes.
      # The entry of this version in CHANGELOG.md has them, see release-please.yml
      - name: Get release notes
        run: |
          set -euo pipefail
          awk -v version="${VERSION}" '
            /^##+ \[/ { if (found) exit; if (index($0, "[" version "]")) found = 1 }
            found
          ' CHANGELOG.md > notes.md
          if [[ ! -s notes.md ]]; then
            echo "::error::CHANGELOG.md has no entry for ${VERSION}"
            exit 1
          fi
          cat notes.md
        env:
          VERSION: ${{ needs.release.outputs.version }}

      - name: Publish release
        run: |
          gh release edit "v${VERSION}" --repo "${{ github.repository }}" --notes-file notes.md
          gh release edit "v${VERSION}" --repo "${{ github.repository }}" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.OVERRIDE_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}

  # The only test check the ruleset requires.
  required:
    # A skipped job counts as passed for required checks, so this job must not
    # be skipped when a test failed.
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    needs:
      - test-iam-floyd
      - test-cdk-iam-floyd
      - test-cdk-iam-floyd-jsii
    steps:
      - name: Check tests
        if: needs.test-iam-floyd.result != 'success' || needs.test-cdk-iam-floyd.result != 'success' || needs.test-cdk-iam-floyd-jsii.result != 'success'
        run: exit 1

      - name: Report success
        run: echo 'Success'
