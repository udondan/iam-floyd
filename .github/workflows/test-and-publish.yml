---
name: Test / Publish / Release

permissions:
  id-token: write # Required for OIDC
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - VERSION
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # Only one run at a time may deploy to the AWS test account.
  wait-for-turn:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      actions: read
      contents: write # lock refs under refs/wait-for-turn/
      pull-requests: read # labels for label-weights
    # A new commit on the branch cancels the waiting of the outdated run, so the
    # new run doesn't queue behind it. Once a run has the turn, this job is
    # done: test jobs that already run are never cancelled.
    concurrency:
      group: test-wait-${{ github.head_ref || github.ref }}
      cancel-in-progress: true
    steps:
      # Queue order: manual PRs and releases first, then Renovate updates.
      # Fails right away if the branch is behind main. Branch protection
      # requires PRs to be up to date, so testing an outdated branch is wasted
      # time: it has to be updated and tested again.
      - name: Wait for turn
        uses: udondan/wait-for-turn@4a9f5171a1dbc3eb182410c772dae951e8ac26e3 # v1.3.0
        with:
          require-up-to-date: true
          label-weights: |
            renovate=-5

  finalize:
    name: Finalize
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.14

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Get the version
        id: get_version
        run: echo "VERSION=$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Update version references
        run: make update-version-refs

      - name: Ensure CHANGELOG exists for version
        run: |
          if [ ! -f CHANGELOG/v${{ steps.get_version.outputs.VERSION }}.md ]; then
            echo "CHANGELOG/v${{ steps.get_version.outputs.VERSION }}.md does not exist"
            exit 1
          fi

      - name: Check for changes
        id: changes
        run: |
          set -xuo pipefail # we intentionally do not use -e here, as rc=1 means we have changes
          git diff
          echo "CHANGED=$(git ls-files -m | wc -l | xargs)" >> $GITHUB_OUTPUT

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git diff --exit-code || git commit -m "Finalize v${{ steps.get_version.outputs.VERSION }}" -a
        if: steps.changes.outputs.CHANGED > 0

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.OVERRIDE_TOKEN }}
          branch: ${{ github.head_ref }}
        if: steps.changes.outputs.CHANGED > 0

      - name: Get current SHA
        run: git rev-parse HEAD > /tmp/sha

      - name: Store SHA as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.run_id }}
          path: /tmp/sha

  test-iam-floyd:
    name: Test iam-floyd
    needs:
      - wait-for-turn
      - finalize
    # A skipped job counts as passed for required checks. Run the job even if
    # wait-for-turn failed and fail it in the first step.
    if: ${{ !cancelled() && needs.finalize.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check turn
        if: needs.wait-for-turn.result != 'success'
        run: exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: x

      - name: Fetch latest SHA
        uses: actions/download-artifact@v8
        with:
          name: ${{ github.run_id }}
          path: /tmp/sha

      - name: Store latest SHA as output
        id: get_sha
        run: echo "SHA=$(cat /tmp/sha/sha)" >> $GITHUB_OUTPUT

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ steps.get_sha.outputs.SHA }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Test npm package
        run: make install test-typescript

      - name: Update package version
        run: |
          npm version "$(cat VERSION)" --allow-same-version --no-git-tag-version
          grep version package.json

      - name: Dry run npm publish
        run: make build publish

  test-cdk-iam-floyd:
    name: Test cdk-iam-floyd
    needs:
      - wait-for-turn
      - finalize
    # A skipped job counts as passed for required checks. Run the job even if
    # wait-for-turn failed and fail it in the first step.
    if: ${{ !cancelled() && needs.finalize.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check turn
        if: needs.wait-for-turn.result != 'success'
        run: exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Fetch latest SHA
        uses: actions/download-artifact@v8
        with:
          name: ${{ github.run_id }}
          path: /tmp/sha

      - name: Store latest SHA as output
        id: get_sha
        run: echo "SHA=$(cat /tmp/sha/sha)" >> $GITHUB_OUTPUT

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ steps.get_sha.outputs.SHA }}

      - name: Build CDK variant
        run: |
          make install
          make cdk
          cat package.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Test npm package
        run: |
          make package
          make test-typescript-cdk
          make cdk-test

  # Python, Java, .NET and Go packages of cdk-iam-floyd, built with jsii-pacmak. One job per
  # language for speed; TypeScript is the baseline the others are compared to. The packages built
  # here are the ones the publish jobs publish.
  test-cdk-iam-floyd-jsii:
    name: Test cdk-iam-floyd in ${{ matrix.language }}
    needs: finalize
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [typescript, python, java, dotnet, go]
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Set up Python
        if: matrix.language == 'python'
        uses: actions/setup-python@v6
        with:
          python-version: 3.14

      - name: Set up Java
        if: matrix.language == 'java'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up .NET
        if: matrix.language == 'dotnet'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Fetch latest SHA
        uses: actions/download-artifact@v8
        with:
          name: ${{ github.run_id }}
          path: /tmp/sha

      - name: Store latest SHA as output
        id: get_sha
        run: echo "SHA=$(cat /tmp/sha/sha)" >> $GITHUB_OUTPUT

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ steps.get_sha.outputs.SHA }}

      - name: Build packages
        run: |
          make install
          make cdk
          make package-jsii LANGUAGES=${{ matrix.language }}

      - name: Test packages
        run: make test-jsii LANGUAGES=${{ matrix.language }}

      # The npm package is published by publish-cdk-iam-floyd, with the jsii assembly
      - name: Dry run npm publish
        if: matrix.language == 'typescript'
        run: make publish

      - name: Build Maven Central bundle
        if: matrix.language == 'java'
        run: bin/publish-maven

      - name: Store packages
        if: matrix.language != 'typescript' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.language }}
          path: dist/${{ matrix.language == 'go' && 'go-module' || matrix.language }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: Release
    if: |
      github.ref == 'refs/heads/main' && (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch'
      )
    needs:
      - test-iam-floyd
      - test-cdk-iam-floyd
      - test-cdk-iam-floyd-jsii
    runs-on: ubuntu-latest
    steps:
      - name: Fetch latest SHA
        uses: actions/download-artifact@v8
        with:
          name: ${{ github.run_id }}
          path: /tmp/sha

      - name: Store latest SHA as output
        id: get_sha
        run: echo "SHA=$(cat /tmp/sha/sha)" >> $GITHUB_OUTPUT

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ steps.get_sha.outputs.SHA }}

      - name: Get the version
        id: get_version
        run: echo "VERSION=$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Create tag
        run: |
          git config --local user.email "${{ secrets.RELEASE_MAIL }}"
          git config --local user.name "udondan"
          git tag -a "v${{ steps.get_version.outputs.VERSION }}" -m "Creates tag v${{ steps.get_version.outputs.VERSION }}"
          git push "https://udondan:${{ secrets.OVERRIDE_TOKEN }}@github.com/${{ github.repository }}.git" --tags
          touch CHANGELOG/v${{ steps.get_version.outputs.VERSION }}.md

      - name: Create release
        run: |
          gh release create "v${{ steps.get_version.outputs.VERSION }}" \
            --title "v${{ steps.get_version.outputs.VERSION }}" \
            --notes-file "CHANGELOG/v${{ steps.get_version.outputs.VERSION }}.md"
        env:
          GH_TOKEN: ${{ secrets.OVERRIDE_TOKEN }}

  publish-iam-floyd:
    name: Publish iam-floyd
    if: |
      github.ref == 'refs/heads/main' && (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch'
      )
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org

      - name: Fetch latest SHA
        uses: actions/download-artifact@v8
        with:
          name: ${{ github.run_id }}
          path: /tmp/sha

      - name: Store latest SHA as output
        id: get_sha
        run: echo "SHA=$(cat /tmp/sha/sha)" >> $GITHUB_OUTPUT

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ steps.get_sha.outputs.SHA }}

      - name: Update package version
        run: |
          npm version "$(cat VERSION)" --allow-same-version --no-git-tag-version
          grep version package.json

      - name: Publish to npm
        run: make install build publish

  publish-cdk-iam-floyd:
    name: Publish cdk-iam-floyd
    if: |
      github.ref == 'refs/heads/main' && (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch'
      )
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org

      - name: Fetch latest SHA
        uses: actions/download-artifact@v8
        with:
          name: ${{ github.run_id }}
          path: /tmp/sha

      - name: Store latest SHA as output
        id: get_sha
        run: echo "SHA=$(cat /tmp/sha/sha)" >> $GITHUB_OUTPUT

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ steps.get_sha.outputs.SHA }}

      - name: Update package version
        run: |
          npm version "$(cat VERSION)" --allow-same-version --no-git-tag-version
          grep version package.json

      - name: Build CDK variant
        run: |
          make install
          make cdk
          cat package.json

      - name: Publish to npm
        run: make package-jsii publish LANGUAGES=typescript

  publish-cdk-iam-floyd-python:
    name: Publish cdk-iam-floyd to PyPI
    if: |
      github.ref == 'refs/heads/main' && (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch'
      )
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Fetch packages
        uses: actions/download-artifact@v8
        with:
          name: packages-python
          path: dist/python

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/python

  publish-cdk-iam-floyd-dotnet:
    name: Publish cdk-iam-floyd to NuGet
    if: |
      github.ref == 'refs/heads/main' && (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch'
      )
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Fetch packages
        uses: actions/download-artifact@v8
        with:
          name: packages-dotnet
          path: dist/dotnet

      - name: Log in to NuGet
        id: nuget
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: udondan

      # The symbols package (.snupkg) next to it is pushed with it
      - name: Publish to NuGet
        run: |
          dotnet nuget push dist/dotnet/*.nupkg \
            --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json

  publish-cdk-iam-floyd-java:
    name: Publish cdk-iam-floyd to Maven Central
    if: |
      github.ref == 'refs/heads/main' && (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch'
      )
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Fetch packages
        uses: actions/download-artifact@v8
        with:
          name: packages-java
          path: dist/java

      - name: Publish to Maven Central
        run: bin/publish-maven
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PRIVATE_KEY_PASSPHRASE: ${{ secrets.MAVEN_GPG_PRIVATE_KEY_PASSPHRASE }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

  # The Go module is served by GitHub Pages as a static Go module proxy. The module zip of every
  # version is a release asset; the proxy serves the newest of them.
  publish-cdk-iam-floyd-go:
    name: Publish cdk-iam-floyd for Go
    if: |
      github.ref == 'refs/heads/main' && (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch'
      )
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write # release assets
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Fetch packages
        uses: actions/download-artifact@v8
        with:
          name: packages-go
          path: dist/go-module

      - name: Add module zip to release
        run: gh release upload "v$(cat VERSION)" dist/go-module/*.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      # Pages sites are limited to 1 GB and a module zip has about 22 MB
      - name: Fetch module zips of the newest releases
        run: |
          mkdir zips
          for tag in $(gh release list --limit 30 --json tagName --jq '.[].tagName'); do
            gh release download "${tag}" --pattern 'cdk-iam-floyd-go-module-*.zip' --dir zips || true
          done
          ls -l zips
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build Go module proxy
        run: bin/go-proxy site site zips/*.zip

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # The only test check the ruleset requires.
  required:
    # A skipped job counts as passed for required checks, so this job must not
    # be skipped when a test failed.
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    needs:
      - test-iam-floyd
      - test-cdk-iam-floyd
      - test-cdk-iam-floyd-jsii
    steps:
      - name: Check tests
        if: needs.test-iam-floyd.result != 'success' || needs.test-cdk-iam-floyd.result != 'success' || needs.test-cdk-iam-floyd-jsii.result != 'success'
        run: exit 1

      - name: Report success
        run: echo 'Success'
