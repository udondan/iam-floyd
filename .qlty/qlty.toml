config_version = "0"

exclude_patterns = [
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "**/.yarn/**",
  "**/*.d.ts",
  "**/assets/**",
  "**/bower_components/**",
  "**/build/**",
  "**/cache/**",
  "**/config/**",
  "**/db/**",
  "**/deps/**",
  "**/dist/**",
  "**/extern/**",
  "**/external/**",
  "**/generated/**",
  "**/Godeps/**",
  "**/gradlew/**",
  "**/mvnw/**",
  "**/node_modules/**",
  "**/protos/**",
  "**/seed/**",
  "**/target/**",
  "**/templates/**",
  "**/testdata/**",
  "**/vendor/**",
  "**/.claude/**",
]

test_patterns = [
  "**/test/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
]

[smells]
mode = "block"

[[source]]
name = "default"
default = true

# The linters that bin/lint runs (eslint, prettier, ruff, shellcheck, actionlint, zizmor, gofmt, …)
# and Trivy (trivy.yml) are not enabled here.

[[plugin]]
name = "bandit"

[[plugin]]
name = "radarlint-python"

[[plugin]]
name = "radarlint-java"

[[plugin]]
name = "radarlint-go"

[[plugin]]
name = "osv-scanner"

[[plugin]]
name = "gitleaks"

# The test scripts check with assert.
[[exclude]]
plugins = ["bandit"]
file_patterns = ["test/**"]

# The examples are snippets of the docs: the runners compile them as classes in the default
# package, the variable shows the type of the statement in the docs, and the example account ID is
# meant to be read.
[[triage]]
match.plugins = ["radarlint-java"]
match.rules = ["java:S1118", "java:S1192", "java:S1220", "java:S1488"]
match.file_patterns = ["examples/**/*.java"]
set.ignored = true

# The Java test runners are compiled in the default package, and their output on stdout is what
# the run scripts compare.
[[triage]]
match.plugins = ["radarlint-java"]
match.rules = ["java:S106", "java:S1220"]
match.file_patterns = ["test/transpile/java/*.java", "test/jsii/**/Main.java"]
set.ignored = true

# The runner calls the package-private example() of the examples by reflection.
[[triage]]
match.plugins = ["radarlint-java"]
match.rules = ["java:S3011"]
match.file_patterns = ["test/transpile/java/Examples.java"]
set.ignored = true

# The package com.udondan.iamFloyd is the published name of the package on Maven Central.
[[triage]]
match.plugins = ["radarlint-java"]
match.rules = ["java:S120"]
match.file_patterns = ["**/com/udondan/iamFloyd/*.java"]
set.ignored = true

# go 1.21 is the oldest supported version of Go, not the one the module is built with.
# osv-scanner reports the vulnerabilities of the standard library of Go 1.21 for it.
[[triage]]
match.plugins = ["osv-scanner"]
match.file_patterns = ["go/iamfloyd/go.mod", "examples/go.mod", "test/jsii/go.mod", "test/transpile/go/go.mod"]
set.ignored = true

# Names of IAM actions and condition keys that look like keys.
[[triage]]
match.plugins = ["gitleaks"]
match.rules = ["generic-api-key"]
match.file_patterns = ["CHANGELOG.md", "docs/source/_static/managed-policies/index.json"]
set.ignored = true
